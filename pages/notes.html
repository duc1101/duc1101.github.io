<style>
@media(min-width: 990px) {
	.main-center{
		max-height: 91.5vh;
		overflow: scroll;
		padding-bottom: 15px;
	}
}
#noteEditor {
	font-size: 0.8rem;
	line-height: 1.35;
}
.docs-preview {
	font-size: 0.8rem;
	line-height: 1.45;
}
.docs-preview h1, .docs-preview h2, .docs-preview h3 {
	font-size: 0.95rem;
	margin-bottom: 0.25rem;
}
</style>
<div class="container-fluid pl-0 pr-0 pt-3">
	<div class="card shadow-sm border-light">
		<div class="card-body">
			<h3 class="card-title mb-2">Docs / Tips</h3>
			<p class="card-text text-muted mb-4">
			ghp_KffhvfbKpa8Fh7nne5wQf8Y7giF20ZVeq
			</p>
			<div class="mb-3">
				<label for="noteEditor" class="form-label"><strong>Nội dung ghi chú</strong></label>
				<textarea id="noteEditor" class="form-control" ng-model="noteContent" placeholder="Viết nội dung công việc tại đây..." ng-readonly="!editEnabled" style="min-height:52vh; line-height:1.35; font-size:0.8rem;"></textarea>
			</div>

			<div class="card mb-4">
				<div class="card-body">
					<div class="docs-preview" ng-bind-html="previewHtml"></div>
				</div>
			</div>

			<div class="d-flex flex-column flex-md-row justify-content-between align-items-start gap-2">
				<div class="btn-group flex-wrap">
					<button class="btn btn-secondary" ng-click="viewMode()">Chế độ xem</button>
					<button class="btn btn-outline-secondary" ng-click="enableEdit()">Chỉnh sửa</button>
					<button class="btn btn-success" ng-click="saveContent()">Lưu tài liệu</button>
					<button class="btn btn-outline-danger" ng-click="deleteContent()">Xóa tài liệu</button>
				</div>
			</div>

			<div class="mt-3 text-end text-success">
				<div ng-show="statusMessage">{{statusMessage}}</div>
			</div>
		</div>
	</div>
</div>
